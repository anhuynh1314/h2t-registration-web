<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2HT Survival - Game sinh tồn thế giới mở do người Việt phát triển. Đăng ký ngay để nhận đặc quyền Alpha/Beta Test." />
    <meta property="og:title" content="2HT Survival — Lý Thuyết Chân Trời Thứ 2" />
    <meta property="og:description" content="Cánh cửa bước vào Lý Thuyết Chân Trời Thứ 2 sắp mở. Đăng ký hẹn trước!" />
    <meta property="og:type" content="website" />
    <title>2HT Survival — Lý Thuyết Chân Trời Thứ 2</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      html, body {
        height: 100%;
        background-color: #000000;
        color: #fff;
        font-family: 'Roboto', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* ===== Typography ===== */
      .font-anton { font-family: 'Anton', sans-serif; }
      .font-oswald { font-family: 'Oswald', sans-serif; }
      .text-outline { -webkit-text-stroke: 2px rgba(255,255,255,1); color: transparent; }

      /* ===== Cinematic Animations ===== */
      @keyframes cineFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      @keyframes cineFadeInUp {
        from { opacity: 0; transform: translateY(28px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes cineScaleIn {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }

      @keyframes cinePulseGlow {
        0%, 100% { box-shadow: 0 0 20px rgba(234,120,30,0.15), 0 0 60px rgba(234,120,30,0.05); }
        50%      { box-shadow: 0 0 28px rgba(234,120,30,0.25), 0 0 80px rgba(234,120,30,0.1); }
      }

      @keyframes scrollBounce {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50%      { transform: translateY(6px); opacity: 1; }
      }

      .animate-cine-fade-in {
        animation: cineFadeIn 1.6s cubic-bezier(0.25, 0.1, 0.25, 1) both;
      }
      .animate-cine-fade-in-up {
        animation: cineFadeInUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .animate-cine-scale-in {
        animation: cineScaleIn 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) both;
      }
      .animate-cine-pulse {
        animation: cinePulseGlow 4s ease-in-out infinite;
      }
      .animate-scroll-bounce {
        animation: scrollBounce 2.5s ease-in-out infinite;
      }

      /* ===== Film Grain Overlay ===== */
      .grain-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 128px 128px;
      }

      /* ===== Hide native video controls on mobile ===== */
      .hero-video::-webkit-media-controls {
        display: none !important;
      }
      .hero-video::-webkit-media-controls-panel {
        display: none !important;
      }
      .hero-video::-webkit-media-controls-play-button {
        display: none !important;
      }
      .hero-video::-webkit-media-controls-start-playback-button {
        display: none !important;
        -webkit-appearance: none;
      }
      .hero-video::-webkit-media-controls-overlay-play-button {
        display: none !important;
      }

      /* ===== Scrollbar ===== */
      ::-webkit-scrollbar { width: 0; background: transparent; }
      ::selection { background: rgba(234,120,30,0.25); color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
